services:
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp_files:/var/www/wordpress
    env_file:
      - .env
    depends_on:
      - wordpress
    restart: unless-stopped
    networks: [intra]

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    expose:
      - "9000"
    volumes:
      - wp_files:/var/www/wordpress
    env_file:
      - .env
    secrets:
      - db_pw
      - wp_pw
      - wp_admin_pw
    depends_on:
      - mariadb
    restart: unless-stopped
    networks: [intra]

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_root_pw
      - db_pw
    restart: unless-stopped
    networks: [intra]

volumes:
  wp_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb

networks:
  intra:
    driver: bridge

secrets:
  db_root_pw:
    file: ./requirements/secrets/db_root_pw.txt
  db_pw:
    file: ./requirements/secrets/db_pw.txt
  wp_admin_pw:
    file: ./requirements/secrets/wp_admin_pw.txt
  wp_pw:
    file: ./requirements/secrets/wp_pw.txt
