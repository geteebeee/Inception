services:
  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp_files:/var/www/wordpress  
    env_file:
      - .env
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:$${NGINX_PORT} -brief >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [intra]

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    expose:
      - "${WP_FPM_PORT}"
    volumes:
      - wp_files:/var/www/wordpress  
    env_file:
      - .env
    environment:
      MYSQL_PASSWORD_FILE: /run/secrets/db_user_password
    depends_on:
      mariadb:
        condition: service_healthy
    secrets:
      - db_user_password
    healthcheck:
      test: ["CMD-SHELL", "php82 -r '$$s=@fsockopen(\"127.0.0.1\", (int)getenv(\"WP_FPM_PORT\"), $$e, $$m, 1); if (!$$s) { exit(1);} fclose($$s);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [intra]

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    command: ["mysqld", "--user=mysql", "--console", "--port=${MARIADB_PORT}"]
    expose:
      - "${MARIADB_PORT}"
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - .env
    environment:
      MYSQL_PASSWORD_FILE: /run/secrets/db_user_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_user_password
      - db_root_password
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -P $${MARIADB_PORT} -uroot -p\"$$(cat /run/secrets/db_root_password)\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [intra]

volumes:
  wp_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WP_PATH}
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DB_PATH}

networks:
  intra:
    driver: bridge

secrets:
  db_user_password:
    file: ./secrets/db_pw.txt
  db_root_password:
    file: ./secrets/db_root_pw.txt
  wp_user_password:
    file: ./secrets/wp_pw.txt
  wp_admin_password:
    file: ./secrets/wp_admin_pw.txt
